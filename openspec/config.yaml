# openspec/config.yaml
# Auto-generated by SDD init executor (gentle-ai) on 2026-08-29.
# Project: how-eat — offline-first local calorie calculator (TDEE + Macros).
# Source of truth: PRD.md (v1.0, 2026-08-28).
# NOTE: This file is user-maintained SDD configuration. Only edit derived
# context deliberately; do not destructively rewrite.

project:
  name: how-eat
  type: frontend-spa
  description: >-
    Offline-first static single-page app that calculates TDEE and macronutrient
    targets from anthropometric inputs. Zero backend, zero runtime calculation
    dependencies. React 18 + Vite + TypeScript (strict) + Tailwind CSS.
  languages: [typescript]
  package_manager: npm

stack:
  framework: react
  framework_version: '18'
  bundler: vite
  ui: tailwindcss
  components: shadcn-ui # copy-paste, no runtime dependency
  icons: lucide-react
  strict_typescript: true # tsconfig "strict": true
  es2022_target: true

testing:
  runner: vitest
  test_command: 'npm run test' # vitest run
  watch_command: 'npm run test:watch' # vitest
  component_testing: '@testing-library/react'
  typecheck_command: 'tsc --noEmit'
  typecheck_allow_errors: 0
  coverage_targets:
    src/lib/calculations.ts: 100 # PRD §9: 100% math engine
    src/lib/storage.ts: 90
    src/lib/url.ts: 90
  coverage_tool: vitest # v8 coverage
  excludes_e2e: true # PRD §2: no E2E in v1

sdd:
  strict_tdd: true # PRD §9: test-first, 0 TS errors
  changes_dir: openspec/changes
  phases: [proposal, spec, design, tasks, apply, verify]
  phase_rules:
    proposal:
      requires: [PRD.md]
      output: 'changes/<change>/proposal.md'
    spec:
      output: 'changes/<change>/specs/<capability>/spec.md'
    design:
      output: 'changes/<change>/design.md'
    tasks:
      output: 'changes/<change>/tasks.md'
      requires_tdd: true
    apply:
      tdd: true
      verify_before_merge: true
    verify:
      runs: [typecheck, test, build]
      requires_all_green: true
  review:
    receipt_driven: false # opt-in, OFF by default

conventions:
  formulas_location: src/lib # pure, exported, testable functions
  pure_functions: true
  no_eval: true
  no_dynamic_innerhtml: true
  csp_strict: true # defined in index.html (PRD §5)
  i18n_keys: src/i18n/es.json # Spanish (Rioplatense) v1; i18n-ready
  accessibility: WCAG21AA
  persistence_key: 'how-eat:v1' # localStorage JSON (Inputs + Macros)

# No active change; completed changes are archived.
active_change: null
